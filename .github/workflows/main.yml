name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # Step 4: Build and push backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # Step 5: Copy deployment files to EC2
      - name: Copy Docker Compose and Nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/ubuntu/app"
          overwrite: true

      # Step 6: Deploy application on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e

            # Navigate to application directory
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            # Verify Docker Compose configuration
            docker compose config -q

            # Login to Docker Hub securely
            echo "$DOCKER_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            # Pull the latest images
            docker compose pull

            # Start or update containers
            docker compose up -d --remove-orphans

            # Remove unused images
            docker image prune -f

            # Show running containers
            docker compose ps

            # Logout from Docker Hub
            docker logout

            echo "Deployment completed successfully!"
